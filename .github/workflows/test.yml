name: Collector tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - name: Windows tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -v
      - name: Linux tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -v
      - name: Zipapp build and command check
        run: |
          python tools/build_collector.py
          python dist/osu-diff-collector.pyz --help
